name: Cyber Scout

on:
  schedule:
    - cron: "0 1 * * 0"  # 每周日 09:00（北京时间，UTC+8）
  workflow_dispatch:

jobs:
  scout:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcurl4-openssl-dev libssl-dev

      - name: Install Eden Crawler deps
        run: pip install -r apps/eden_crawler/eden_crawler/requirements.txt

      - name: Install jam_cyber_scout deps
        run: pip install -r requirements.txt

      - name: Run weather
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python main.py weather
