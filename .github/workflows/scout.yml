name: Cyber Scout

on:
  schedule:
    - cron: "0 1 * * *"  # 北京时间 9:00
  workflow_dispatch:

jobs:
  scout:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcurl4-openssl-dev libssl-dev

      - name: Install Eden Crawler deps
        run: pip install -r apps/eden_crawler/eden_crawler/requirements.txt

      - name: Install jam_cyber_scout deps
        run: pip install -r requirements.txt

      - name: Run scout
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python main.py
