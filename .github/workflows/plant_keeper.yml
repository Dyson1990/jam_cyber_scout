name: Plant Keeper

on:
  schedule:
    - cron: "0 0 * * *" # UTC 00:00 = 北京时间 08:00
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python main.py plant_remind
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
      - run: python main.py plant_update
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
      - name: Commit state
        run: |
          git config user.name "plant-bot"
          git config user.email "plant-bot@users.noreply.github.com"
          git add apps/plant_keeper/plants.json
          git diff --cached --quiet || git commit -m "植物浇水状态更新"
          git push
